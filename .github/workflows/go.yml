# Pull requests, main and branch pushes in forks package the macOS, Windows and
# Linux installers. This catches packaging failures before release and makes
# the installers available as artifacts. test.yml runs the Go checks, and
# release.yml signs and uploads the updates.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR replaces the pending work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, runner: macos-latest, goos: darwin }
          - { name: Windows, runner: ubuntu-latest, goos: windows }
          - { name: Linux, runner: ubuntu-latest, goos: linux }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Windows installers are made with NSIS.
      - name: Install NSIS, for the Windows installers
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # mygo build warns and signs no update archives without the updater
      # key, which is a release secret: these are the installers of a
      # release, unsigned, and -upload would need a draft release.
      - name: Build the packages
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
        run: |
          args=()
          if [[ "$TARGET_OS" == darwin ]]; then
            # Ad hoc signing needs no Apple certificate.
            args=(-sign - -skip-notarize)
          fi
          for arch in amd64 arm64; do
            out="build/$arch"
            go tool mygo build -platform "$TARGET_OS/$arch" -o "$out" "${args[@]}"
            if [[ -f "$out/SHA256SUMS" ]]; then
              mv "$out/SHA256SUMS" "$out/$TARGET_OS-$arch/"
            fi
          done
      - name: Upload amd64 packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.goos }}-amd64
          path: build/amd64/${{ matrix.goos }}-amd64/
          if-no-files-found: error
          retention-days: 7
      - name: Upload arm64 packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.goos }}-arm64
          path: build/arm64/${{ matrix.goos }}-arm64/
          if-no-files-found: error
          retention-days: 7
