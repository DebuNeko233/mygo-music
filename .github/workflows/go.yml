# Pull requests, main and branch pushes in forks package the macOS, Windows and
# Linux installers. This catches packaging failures before release and makes
# the installers available as artifacts. test.yml runs the Go checks, and
# release.yml signs and uploads the updates.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR replaces the pending work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Windows installers are made with NSIS.
      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis
      # mygo build warns and signs no update archives without the updater
      # key, which is a release secret: these are the installers of a
      # release, unsigned, and -upload would need a draft release.
      - name: Build the packages
        run: |
          go tool mygo build \
            -platform windows/amd64,windows/arm64,linux/amd64,linux/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/
          retention-days: 7

  macos:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Ad hoc signing needs no Apple certificate; the DMGs are not notarized.
      - name: Build the packages
        run: |
          go tool mygo build \
            -platform darwin/arm64,darwin/amd64 -sign - -skip-notarize
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: build/
          retention-days: 7
