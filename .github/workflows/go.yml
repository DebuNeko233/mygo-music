# Every push and pull request packages the app for macOS, Windows and Linux, with
# its installers, the way a release does: a change that breaks the build or
# the packaging fails here instead of on a tag, and the installers of a run
# can be downloaded from its artifacts. test.yml compiles the Go packages
# and runs the tests; release.yml signs the updates and uploads the packages.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Windows installers are made with NSIS.
      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis
      # mygo build warns and signs no update archives without the updater
      # key, which is a release secret: these are the installers of a
      # release, unsigned, and -upload would need a draft release.
      - name: Build the packages
        run: |
          go tool mygo build \
            -platform windows/amd64,windows/arm64,linux/amd64,linux/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/
          retention-days: 7

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Ad hoc signing needs no Apple certificate; the DMGs are not notarized.
      - name: Build the packages
        run: |
          go tool mygo build \
            -platform darwin/arm64,darwin/amd64 -sign - -skip-notarize
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: build/
          retention-days: 7
