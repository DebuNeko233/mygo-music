# Build and sign each platform in parallel; one writer publishes the draft.
# Installed apps see the release only after a maintainer publishes it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A retry of the same tag must not race another publisher or interrupt uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the independent release configuration
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test "$(jq -r .updates.github mygo.json)" = "$GITHUB_REPOSITORY"
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "Configure this repository's MYGO_UPDATER_PRIVATE_KEY before releasing." >&2
            exit 1
          fi
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Validate release tooling and notes
        run: |
          python3 -m unittest discover -s .github/scripts -p '*_test.py'
          python3 .github/scripts/release_notes.py > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, goos: darwin, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, goos: windows, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, goos: linux, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed packages
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # No Apple certificate or notary credentials are needed.
            args=(-sign - -skip-notarize)
          fi
          go tool mygo build -platform "$TARGET_PLATFORM" "${args[@]}"
      - name: Collect this platform's release assets
        env:
          TARGET_OS: ${{ matrix.goos }}
        run: |
          python3 .github/scripts/release_assets.py stage --platform "$TARGET_OS" \
            --source build --output "$RUNNER_TEMP/release-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Keep each platform in its own directory; their local SHA256SUMS differ.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-inputs
          merge-multiple: false
      - name: Verify all platforms and generate global checksums
        run: |
          python3 .github/scripts/release_assets.py merge \
            --source "$RUNNER_TEMP/release-inputs" --output "$RUNNER_TEMP/release-assets"
          python3 .github/scripts/release_notes.py > "$RUNNER_TEMP/notes.md"
      - name: Upload the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_assets.py publish \
            --source "$RUNNER_TEMP/release-assets" --notes "$RUNNER_TEMP/notes.md" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
