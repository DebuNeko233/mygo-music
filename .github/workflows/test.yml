# Every push and pull request builds the packages, vets them and runs the
# tests: the release workflow builds the apps on a tag, and nothing else
# looked at a change before it was released.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # The tests that call NetEase skip unless LIVE is set, and the ones
      # that save frames into NM_FRAMES unless it is: neither is. A transient
      # failure gets two more attempts; the same failing test still fails.
      - name: Test
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go test -count=1 ./internal/...; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Test attempt $attempt failed; retrying."
              sleep 2
            fi
          done
          echo "::error::Tests failed after three attempts."
          exit 1
