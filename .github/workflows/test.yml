# Check pull requests, main and branch pushes in forks. The slower full app
# race suite runs separately in race.yml.
name: Test

on:
  push:
    branches: ['**']
  pull_request:

# A newer commit on the same branch or PR replaces the pending work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Build Go packages
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...

  vet:
    name: Go and MyGo vet
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        # MyGo runs go vet ./... before its own UI checks.
        run: go tool mygo vet .

  unit-packages:
    name: Unit tests (other packages)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test non-app packages
        shell: bash
        run: |
          packages=$(go list ./internal/... | grep -v '/internal/app$')
          mapfile -t package_list <<< "$packages"
          go test -count=1 "${package_list[@]}"

  unit-app:
    name: Unit tests (app ${{ matrix.shard }})
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tests that call NetEase skip unless LIVE is set, and the ones
      # that save frames into NM_FRAMES unless it is: neither is. A test that
      # fails is not tried again: a flaky one is fixed or dropped, as
      # AGENTS.md asks.
      - name: Test app shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pattern=$(go test -list '^(Test|Example|Fuzz)' ./internal/app |
            python3 .github/scripts/shard_app_tests.py "$SHARD")
          go test -count=1 -run "$pattern" ./internal/app

  race-quick:
    name: Race detector (quick)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test non-app packages under the race detector
        shell: bash
        run: |
          packages=$(go list ./internal/... | grep -v '/internal/app$')
          mapfile -t package_list <<< "$packages"
          go test -count=1 -race -timeout 30m "${package_list[@]}"
      # These tests exercise storage workers, view models and callbacks without
      # rendering the animation suite.
      - name: Test app concurrency under the race detector
        run: >-
          go test -v -count=1 -race
          -run '^(TestSettingsSaver.*|TestSessionKeepsLatestSave|TestEarlyPostsAreNotLost|TestPostDispatchBelongsToApp|TestEpisodeLikeClickBeatsAnswer|TestArtReleaseUsesTheDispatcher|TestDownloadProgressAndPendingCancellation|TestDownloadsCancelOnAccountChange|TestDownloadQuitWaitsForCleanup|TestDownloadRetrySharesDedupAndClearsResult|TestCloudViewModel.*|TestDownloadViewModel.*)$'
          ./internal/app
