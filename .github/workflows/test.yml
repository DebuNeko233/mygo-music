# Every push and pull request builds the packages, vets them and runs the
# tests, once plain and once under the race detector: the release workflow
# builds the apps on a tag, and nothing else looked at a change before it was
# released.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .
      # The tests that call NetEase skip unless LIVE is set, and the ones
      # that save frames into NM_FRAMES unless it is: neither is. A test that
      # fails is not tried again: a flaky one is fixed or dropped, as
      # AGENTS.md asks.
      - name: Test
        run: go test -count=1 ./internal/...
      - name: Test under the race detector
        # The views are drawn on one goroutine and their work is done on
        # others, which only this run looks at. It is slow enough to need
        # more than the default ten minutes.
        env:
          CGO_ENABLED: 1
        run: go test -count=1 -race -timeout 30m ./internal/...
