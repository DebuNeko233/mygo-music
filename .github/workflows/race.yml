# Run full UI races for relevant main-branch changes or explicit requests.
# Documentation and release-note edits do not schedule the expensive suite.
name: Full UI Race

on:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'internal/**'
      - 'icon/**'
      - 'go.mod'
      - 'go.sum'
      - 'mygo.json'
      - '.github/scripts/shard_app_tests.py'
      - '.github/workflows/race.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full commit SHA to test (leave blank to test the selected branch)'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: Race detector (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CGO_ENABLED: 1
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Validate the commit SHA
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'Provide a full 40-character commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Record the tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.source_sha }}
      - name: Test under the race detector
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_JOBS: ${{ strategy.job-total }}
        run: |
          pattern=$(go test -race -list '^(Test|Example|Fuzz)' ./internal/app |
            python3 .github/scripts/shard_app_tests.py --race --shards "$TOTAL_JOBS" "$SHARD")
          # A single software-rendered animation may take several minutes
          # under the detector. This is a per-shard budget, not a job timeout.
          go test -v -count=1 -race -timeout 60m -run "$pattern" ./internal/app
